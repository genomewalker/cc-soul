name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          dnf install -y wget perl-IPC-Cmd cmake ninja-build python3.11 python3.11-devel

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - name: Build chitta-field
        env:
          PYO3_PYTHON: /usr/bin/python3.11
        run: |
          cd chitta-field
          ./build.sh build --release

      - name: Install nlohmann_json
        run: |
          cd /tmp
          wget -q https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp
          mkdir -p /opt/nlohmann_json/include/nlohmann
          mv json.hpp /opt/nlohmann_json/include/nlohmann/

      - name: Build chitta
        run: |
          mkdir -p chitta/build bin
          cd chitta/build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH="\$ORIGIN" \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DPython3_EXECUTABLE=/usr/bin/python3.11 \
            -DCHITTA_WITH_LLAMA_CPP=ON \
            -DJSON_INCLUDE_DIR=/opt/nlohmann_json/include
          ninja

      - name: Verify binaries
        run: |
          ls -la bin/
          for b in chitta chittad; do
            test -x bin/$b || { echo "Missing: $b"; exit 1; }
          done

      - name: Package binaries
        run: |
          PYLIB=$(python3.11 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')/libpython3.11.so.1.0
          [ -f "$PYLIB" ] && cp "$PYLIB" bin/ && ln -sf libpython3.11.so.1.0 bin/libpython3.11.so
          for b in bin/chitta bin/chittad; do
            patchelf --set-rpath '$ORIGIN' $b 2>/dev/null || true
          done
          echo "Checking library dependencies..."
          for b in bin/chitta bin/chittad; do
            echo "=== $b ==="
            ldd $b | grep -E "not found" || echo "All libs found"
          done
          tar -czvf dist/chitta-linux-x64.tar.gz -C bin .
        working-directory: .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chitta-linux-x64
          path: dist/chitta-linux-x64.tar.gz

  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download embedding model
        run: |
          pip install huggingface_hub
          python -c "
          from huggingface_hub import hf_hub_download
          import shutil, os

          # nomic-embed-text-v1.5: 768-dim, 137M params, llama.cpp GGUF
          model_path = hf_hub_download(
              repo_id='nomic-ai/nomic-embed-text-v1.5-GGUF',
              filename='nomic-embed-text-v1.5.Q8_0.gguf'
          )

          os.makedirs('models', exist_ok=True)
          dest = 'models/nomic-embed-text-v1.5.gguf'
          shutil.copy(model_path, dest)
          print(f'Model: {os.path.getsize(dest)} bytes')
          "

      - name: Package models
        run: tar -czvf embed-models.tar.gz -C models .

      - name: Upload models
        uses: actions/upload-artifact@v4
        with:
          name: embed-models
          path: embed-models.tar.gz

  release:
    needs: [build-linux, models]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List release files
        run: ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
