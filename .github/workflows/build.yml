name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  ONNX_VERSION: "1.16.3"
  DUCKDB_VERSION: "1.1.3"

jobs:
  build-linux:
    # Ubuntu 20.04 has glibc 2.31 - compatible with most systems
    runs-on: ubuntu-20.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true

      - name: Install dependencies (except DuckDB)
        shell: bash -l {0}
        run: |
          conda install -y cmake nlohmann_json sqlite onnxruntime-cpp=${{ env.ONNX_VERSION }} patchelf

      - name: Build DuckDB from source
        shell: bash -l {0}
        run: |
          git clone --depth 1 --branch v${{ env.DUCKDB_VERSION }} https://github.com/duckdb/duckdb.git
          cd duckdb
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHELL=OFF \
            -DBUILD_UNITTESTS=OFF \
            -DENABLE_SANITIZER=OFF \
            -DENABLE_UBSAN=OFF
          make -j$(nproc)
          # Install to a local prefix
          mkdir -p /opt/duckdb/{lib,include}
          sudo cp src/libduckdb.so /opt/duckdb/lib/
          sudo cp -r ../src/include/duckdb* /opt/duckdb/include/

      - name: Build chitta
        shell: bash -l {0}
        run: |
          mkdir -p chitta/build bin
          cd chitta/build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH="\$ORIGIN" \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DDUCKDB_INCLUDE_DIR=/opt/duckdb/include \
            -DDUCKDB_LIB_DIR=/opt/duckdb/lib \
            -DONNXRUNTIME_INCLUDE_DIR=$CONDA_PREFIX/include \
            -DONNXRUNTIME_LIB_DIR=$CONDA_PREFIX/lib
          make -j$(nproc)

      - name: Verify binaries
        run: |
          ls -la bin/
          for bin in chitta chittad chitta_migrate chitta_import duckdb_test; do
            test -x bin/$bin || { echo "Missing: $bin"; exit 1; }
          done

      - name: Run tests
        shell: bash -l {0}
        run: |
          cd chitta/build
          LD_LIBRARY_PATH=/opt/duckdb/lib:$CONDA_PREFIX/lib:$LD_LIBRARY_PATH ctest --output-on-failure || true

      - name: Package binaries
        shell: bash -l {0}
        run: |
          mkdir -p dist
          # Bundle all required libraries
          cp $CONDA_PREFIX/lib/libonnxruntime.so* bin/
          cp /opt/duckdb/lib/libduckdb.so bin/
          # Bundle libstdc++ to avoid version mismatches on older systems
          cp $CONDA_PREFIX/lib/libstdc++.so* bin/ 2>/dev/null || true
          # Set RPATH for all binaries to find bundled libs
          for bin in bin/chitta bin/chittad bin/chitta_migrate bin/chitta_import bin/duckdb_test; do
            patchelf --set-rpath '$ORIGIN' $bin 2>/dev/null || true
          done
          # Verify all binaries
          echo "Verifying library dependencies..."
          export LD_LIBRARY_PATH=$(pwd)/bin:$LD_LIBRARY_PATH
          for bin in bin/chitta bin/chittad; do
            echo "=== $bin ==="
            ldd $bin | grep -E "not found|ORIGIN" || true
          done
          # Create tarball
          tar -czvf dist/chitta-linux-x64.tar.gz -C bin .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chitta-linux-x64
          path: dist/chitta-linux-x64.tar.gz

  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download ONNX model
        run: |
          pip install huggingface_hub
          python -c "
          from huggingface_hub import hf_hub_download
          import shutil
          import os

          # Download all-MiniLM-L6-v2 ONNX model
          model_path = hf_hub_download(
              repo_id='sentence-transformers/all-MiniLM-L6-v2',
              filename='onnx/model.onnx'
          )
          vocab_path = hf_hub_download(
              repo_id='sentence-transformers/all-MiniLM-L6-v2',
              filename='vocab.txt'
          )

          os.makedirs('models', exist_ok=True)
          shutil.copy(model_path, 'models/model.onnx')
          shutil.copy(vocab_path, 'models/vocab.txt')
          print(f'Model: {os.path.getsize(\"models/model.onnx\")} bytes')
          print(f'Vocab: {os.path.getsize(\"models/vocab.txt\")} bytes')
          "

      - name: Package models
        run: tar -czvf onnx-models.tar.gz -C models .

      - name: Upload models
        uses: actions/upload-artifact@v4
        with:
          name: onnx-models
          path: onnx-models.tar.gz

  build-macos:
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: macos-arm64
            conda_subdir: osx-arm64
          - os: macos-15-intel
            arch: macos-x64
            conda_subdir: osx-64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          CONDA_SUBDIR=${{ matrix.conda_subdir }} conda install -y cmake nlohmann_json sqlite onnxruntime-cpp=${{ env.ONNX_VERSION }} libduckdb-devel

      - name: Build chitta
        shell: bash -l {0}
        run: |
          mkdir -p chitta/build bin
          cd chitta/build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH="@executable_path" \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DONNXRUNTIME_INCLUDE_DIR=$CONDA_PREFIX/include \
            -DONNXRUNTIME_LIB_DIR=$CONDA_PREFIX/lib
          make -j$(sysctl -n hw.ncpu)

      - name: Verify binaries
        run: |
          ls -la bin/
          for bin in chitta chittad chitta_migrate chitta_import duckdb_test; do
            test -x bin/$bin || { echo "Missing: $bin"; exit 1; }
          done

      - name: Run tests
        shell: bash -l {0}
        run: |
          cd chitta/build
          DYLD_LIBRARY_PATH=$CONDA_PREFIX/lib:$DYLD_LIBRARY_PATH ctest --output-on-failure || true

      - name: Package binaries
        shell: bash -l {0}
        run: |
          mkdir -p dist
          # Bundle required libraries
          cp $CONDA_PREFIX/lib/libonnxruntime.${{ env.ONNX_VERSION }}.dylib bin/
          ln -sf libonnxruntime.${{ env.ONNX_VERSION }}.dylib bin/libonnxruntime.dylib
          cp $CONDA_PREFIX/lib/libduckdb.dylib bin/
          # Update library paths
          for bin in bin/chitta bin/chittad bin/chitta_migrate bin/chitta_import bin/duckdb_test; do
            install_name_tool -add_rpath @executable_path $bin 2>/dev/null || true
            # Fix libonnxruntime reference
            install_name_tool -change @rpath/libonnxruntime.${{ env.ONNX_VERSION }}.dylib @executable_path/libonnxruntime.${{ env.ONNX_VERSION }}.dylib $bin 2>/dev/null || true
            # Fix libduckdb reference
            install_name_tool -change @rpath/libduckdb.dylib @executable_path/libduckdb.dylib $bin 2>/dev/null || true
          done
          # Create tarball
          tar -czvf dist/chitta-${{ matrix.arch }}.tar.gz -C bin .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chitta-${{ matrix.arch }}
          path: dist/chitta-${{ matrix.arch }}.tar.gz

  release:
    needs: [build-linux, build-macos, models]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List release files
        run: ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
