name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  ONNX_VERSION: "1.16.3"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64

    env:
      DUCKDB_VERSION: "1.1.3"

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          dnf install -y cmake ninja-build git curl patchelf

      - name: Setup Miniconda
        run: |
          curl -L -o miniconda.sh https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
          bash miniconda.sh -b -p /opt/conda
          rm miniconda.sh

      - name: Install dependencies (except DuckDB and ONNX)
        run: |
          source /opt/conda/bin/activate
          conda install -y -c conda-forge cmake nlohmann_json sqlite

      - name: Download ONNX Runtime
        run: |
          # Download official pre-built ONNX Runtime (better glibc compatibility than conda)
          curl -L -o onnxruntime.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ONNX_VERSION }}/onnxruntime-linux-x64-${{ env.ONNX_VERSION }}.tgz"
          tar xzf onnxruntime.tgz
          mkdir -p /opt/onnxruntime
          mv onnxruntime-linux-x64-${{ env.ONNX_VERSION }}/* /opt/onnxruntime/
          rm onnxruntime.tgz

      - name: Build DuckDB from source
        run: |
          git clone --depth 1 --branch v${{ env.DUCKDB_VERSION }} https://github.com/duckdb/duckdb.git
          cd duckdb
          mkdir build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHELL=OFF \
            -DBUILD_UNITTESTS=OFF \
            -DENABLE_SANITIZER=OFF \
            -DENABLE_UBSAN=OFF
          ninja -j$(nproc)
          # Install to a local prefix
          mkdir -p /opt/duckdb/{lib,include}
          cp src/libduckdb.so /opt/duckdb/lib/
          cp -r ../src/include/duckdb* /opt/duckdb/include/

      - name: Build chitta
        run: |
          source /opt/conda/bin/activate
          mkdir -p chitta/build bin
          cd chitta/build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH="\$ORIGIN" \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DDUCKDB_INCLUDE_DIR=/opt/duckdb/include \
            -DDUCKDB_LIB_DIR=/opt/duckdb/lib \
            -DONNXRUNTIME_INCLUDE_DIR=/opt/onnxruntime/include \
            -DONNXRUNTIME_LIB_DIR=/opt/onnxruntime/lib
          make -j$(nproc)

      - name: Verify binaries
        run: |
          ls -la bin/
          for bin in chitta chittad chitta_migrate chitta_import duckdb_test; do
            test -x bin/$bin || { echo "Missing: $bin"; exit 1; }
          done

      - name: Run tests
        run: |
          cd chitta/build
          LD_LIBRARY_PATH=/opt/duckdb/lib:/opt/onnxruntime/lib:$LD_LIBRARY_PATH ctest --output-on-failure || true

      - name: Package binaries
        run: |
          mkdir -p dist
          # Bundle all required libraries
          cp /opt/onnxruntime/lib/libonnxruntime.so* bin/
          cp /opt/duckdb/lib/libduckdb.so bin/
          # Set RPATH for all binaries to find bundled libs
          for bin in bin/chitta bin/chittad bin/chitta_migrate bin/chitta_import bin/duckdb_test; do
            patchelf --set-rpath '$ORIGIN' $bin 2>/dev/null || true
          done
          # Verify all binaries
          echo "Verifying library dependencies..."
          export LD_LIBRARY_PATH=$(pwd)/bin:$LD_LIBRARY_PATH
          for bin in chittad chitta chitta_migrate chitta_import duckdb_test; do
            echo "=== $bin ==="
            ldd bin/$bin | grep "not found" && { echo "WARNING: $bin has missing deps (may be system libs)"; } || true
          done
          tar -czvf dist/chitta-linux-x64.tar.gz -C bin .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chitta-linux-x64
          path: dist/chitta-linux-x64.tar.gz

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macos-x64
            conda_platform: osx-64
          - os: macos-latest
            platform: macos-arm64
            conda_platform: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          conda install -y cmake nlohmann_json sqlite onnxruntime-cpp=${{ env.ONNX_VERSION }} libduckdb-devel

      - name: Build chitta
        shell: bash -l {0}
        run: |
          mkdir -p chitta/build bin
          cd chitta/build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH="@executable_path" \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DONNXRUNTIME_INCLUDE_DIR=$CONDA_PREFIX/include \
            -DONNXRUNTIME_LIB_DIR=$CONDA_PREFIX/lib
          make -j$(sysctl -n hw.ncpu)

      - name: Verify binaries
        run: |
          ls -la bin/
          for bin in chitta chittad chitta_migrate chitta_import duckdb_test; do
            test -x bin/$bin || { echo "Missing: $bin"; exit 1; }
          done

      - name: Run tests
        shell: bash -l {0}
        run: |
          cd chitta/build
          DYLD_LIBRARY_PATH=$CONDA_PREFIX/lib:$DYLD_LIBRARY_PATH ctest --output-on-failure || true

      - name: Package binaries
        shell: bash -l {0}
        run: |
          mkdir -p dist
          cp $CONDA_PREFIX/lib/libonnxruntime*.dylib bin/
          cp $CONDA_PREFIX/lib/libduckdb*.dylib bin/
          tar -czvf dist/chitta-${{ matrix.platform }}.tar.gz -C bin .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chitta-${{ matrix.platform }}
          path: dist/chitta-${{ matrix.platform }}.tar.gz

  # Download ONNX models and compute checksums
  models:
    runs-on: ubuntu-latest
    steps:
      - name: Download models
        run: |
          mkdir -p models
          curl -L -o models/model.onnx \
            "https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx"
          curl -L -o models/vocab.txt \
            "https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/vocab.txt"

      - name: Compute checksums
        run: |
          cd models
          sha256sum model.onnx vocab.txt > checksums.sha256
          cat checksums.sha256

      - name: Upload models
        uses: actions/upload-artifact@v4
        with:
          name: onnx-models
          path: models/

  # Create release with binaries
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, models]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          # Move platform binaries
          mv artifacts/chitta-*/chitta-*.tar.gz release/
          # Package models with checksums
          tar -czvf release/onnx-models.tar.gz -C artifacts/onnx-models .
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
