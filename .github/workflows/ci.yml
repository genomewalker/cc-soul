name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.11"
          channels: conda-forge

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          conda install -y cmake nlohmann_json sqlite
          conda install -y -c conda-forge onnxruntime-cpp

      - name: Build chitta-field
        shell: bash -l {0}
        run: |
          cd chitta-field
          ./build.sh build --release

      - name: Build
        shell: bash -l {0}
        run: |
          mkdir -p chitta/build
          cd chitta/build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --parallel

      - name: Verify binaries
        run: |
          ls -la bin/
          test -x bin/chitta
          test -x bin/chittad

      - name: Run tests
        shell: bash -l {0}
        run: |
          cd chitta/build
          ctest --output-on-failure || true

  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Check shell scripts
        run: |
          shellcheck scripts/*.sh setup.sh || true
