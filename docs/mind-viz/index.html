<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chitta — mind observatory</title>
<script src="https://unpkg.com/3d-force-graph@1/dist/3d-force-graph.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #070710;
  --glass:   rgba(7,7,20,0.86);
  --glass2:  rgba(12,12,28,0.92);
  --border:  rgba(89,179,250,0.14);
  --border2: rgba(89,179,250,0.22);
  --text:    #cdd6f4;
  --dim:     #585b70;
  --dimmer:  #313244;
  --accent:  #89b4fa;
  --green:   #a6e3a1;
  --yellow:  #f9e2af;
  --red:     #f38ba8;
  --peach:   #fab387;
  --mauve:   #cba6f7;
  --teal:    #94e2d5;
  --sky:     #89dceb;
  --sapphire:#74c7ec;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
  font-size: 11px;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
}
#graph-container {
  position: absolute;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
}
.hud {
  position: fixed;
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 8px;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: 10px 14px;
  z-index: 100;
  pointer-events: auto;
}
.hud-title {
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-size: 9px;
  margin-bottom: 7px;
}

/* header */
#hud-header {
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 14px;
  white-space: nowrap;
  padding: 7px 20px;
}
#hud-header h1 { font-size: 13px; color: var(--accent); letter-spacing: 3px; font-weight: 400; }
.sep { color: var(--dimmer); }
#memory-count { color: var(--mauve); }
#connection-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--red);
  display: inline-block;
  transition: background 0.5s;
  box-shadow: 0 0 0 0 rgba(243,139,168,0);
}
#connection-dot.ok {
  background: var(--green);
  animation: dot-pulse 3s infinite;
}
@keyframes dot-pulse {
  0%   { box-shadow: 0 0 0 0 rgba(166,227,161,0.6); }
  70%  { box-shadow: 0 0 0 5px rgba(166,227,161,0); }
  100% { box-shadow: 0 0 0 0 rgba(166,227,161,0); }
}

/* search */
#hud-search {
  top: 12px;
  left: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
}
#search-icon { color: var(--dim); font-size: 14px; }
#search {
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font: inherit;
  font-size: 11px;
  width: 200px;
}
#search::placeholder { color: var(--dim); }
#search-count { color: var(--dim); font-size: 10px; min-width: 40px; text-align: right; }

/* stats */
#hud-stats {
  top: 12px;
  right: 12px;
  min-width: 190px;
}
.stat-row { display: flex; justify-content: space-between; gap: 20px; margin: 2px 0; }
.stat-label { color: var(--dim); }
.stat-val   { color: var(--accent); }
.kind-bar { margin-top: 8px; }
.kind-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 2px 0;
  cursor: pointer;
  border-radius: 3px;
  padding: 1px 3px;
  transition: background 0.15s;
}
.kind-row:hover { background: rgba(89,179,250,0.08); }
.kind-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.kind-name { color: var(--dim); flex: 1; }
.kind-bar-fill { height: 3px; border-radius: 2px; margin-top: 2px; opacity: 0.5; }
.kind-count { color: var(--text); margin-left: auto; }

/* instances */
#hud-instances {
  bottom: 20px;
  right: 12px;
  min-width: 230px;
  max-height: 200px;
  overflow-y: auto;
}
.inst-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.inst-item:last-child { border-bottom: none; }
.inst-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.inst-dot.active { animation: glow-pulse 2s infinite; }
@keyframes glow-pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.5; transform: scale(0.8); }
}
.inst-project {
  color: var(--text);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 150px;
}
.inst-id { color: var(--dimmer); font-size: 9px; }
.inst-age { color: var(--dim); font-size: 10px; margin-left: auto; white-space: nowrap; }

/* inspector */
#hud-inspector {
  top: 60px;
  right: 12px;
  width: 290px;
  max-height: calc(100vh - 280px);
  overflow-y: auto;
  display: none;
  scrollbar-width: thin;
  scrollbar-color: var(--dimmer) transparent;
}
#hud-inspector.visible { display: block; }
.insp-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.insp-kind-badge {
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 1px;
  background: rgba(255,255,255,0.06);
}
.insp-close {
  margin-left: auto;
  cursor: pointer;
  color: var(--dim);
  font-size: 14px;
  line-height: 1;
  user-select: none;
}
.insp-close:hover { color: var(--text); }
.insp-content {
  color: var(--text);
  line-height: 1.55;
  margin-bottom: 10px;
  word-break: break-word;
  font-size: 11px;
}
.insp-meta { color: var(--dim); font-size: 10px; margin-bottom: 6px; }
.insp-assoc-title {
  color: var(--dim);
  text-transform: uppercase;
  font-size: 9px;
  letter-spacing: 1px;
  margin: 8px 0 4px;
}
.assoc-item {
  padding: 4px 8px;
  margin: 2px 0;
  border-radius: 4px;
  cursor: pointer;
  background: rgba(89,179,250,0.05);
  border: 1px solid transparent;
  transition: all 0.15s;
  word-break: break-word;
  line-height: 1.4;
}
.assoc-item:hover {
  background: rgba(89,179,250,0.12);
  border-color: var(--border);
}
.assoc-rel {
  color: var(--dim);
  font-size: 9px;
  display: block;
  margin-bottom: 2px;
}

/* recall feed */
#hud-recall {
  bottom: 20px;
  left: 12px;
  width: 310px;
  max-height: 160px;
  overflow: hidden;
}
.recall-item {
  padding: 3px 0;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  display: flex;
  gap: 8px;
  align-items: baseline;
  animation: fadeInDown 0.25s ease;
}
.recall-item:last-child { border-bottom: none; }
.recall-count { color: var(--mauve); }
.recall-time { color: var(--dim); font-size: 10px; margin-left: auto; }
@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* legend */
#hud-legend {
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: center;
  padding: 7px 18px;
  pointer-events: none;
}
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 7px; height: 7px; border-radius: 50%; }
.legend-label { color: var(--dim); font-size: 10px; }

/* controls hint */
#hud-controls {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  margin-top: 6px;
  color: var(--dimmer);
  font-size: 9px;
  text-align: center;
  pointer-events: none;
  z-index: 99;
}

/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--dimmer); border-radius: 2px; }
</style>
</head>
<body>
<div id="graph-container"></div>

<!-- header -->
<div class="hud" id="hud-header">
  <h1>chitta</h1>
  <span class="sep">·</span>
  <span id="memory-count">loading…</span>
  <span class="sep">·</span>
  <span id="connection-dot"></span>
  <span id="conn-label" style="color:var(--dim)">connecting…</span>
</div>

<!-- search -->
<div class="hud" id="hud-search">
  <span id="search-icon">⌕</span>
  <input id="search" type="text" placeholder="search memories…" autocomplete="off" spellcheck="false">
  <span id="search-count"></span>
</div>

<!-- stats -->
<div class="hud" id="hud-stats">
  <div class="hud-title">stats</div>
  <div class="stat-row"><span class="stat-label">total</span><span class="stat-val" id="s-total">—</span></div>
  <div class="stat-row"><span class="stat-label">symbols</span><span class="stat-val" id="s-symbols">—</span></div>
  <div class="stat-row"><span class="stat-label">triplets</span><span class="stat-val" id="s-triplets">—</span></div>
  <div class="kind-bar" id="kind-bar"></div>
</div>

<!-- instances -->
<div class="hud" id="hud-instances">
  <div class="hud-title">active instances</div>
  <div id="instances-list"><span style="color:var(--dim)">loading…</span></div>
</div>

<!-- inspector -->
<div class="hud" id="hud-inspector">
  <div class="insp-header">
    <span class="insp-kind-badge" id="insp-kind-badge" style="color:var(--dim)">—</span>
    <span class="insp-close" onclick="closeInspector()">✕</span>
  </div>
  <div class="insp-content" id="insp-content">—</div>
  <div class="insp-meta" id="insp-meta"></div>
  <div class="insp-assoc-title">associations</div>
  <div id="insp-assocs"><span style="color:var(--dim)">—</span></div>
</div>

<!-- recall feed -->
<div class="hud" id="hud-recall">
  <div class="hud-title">recall feed</div>
  <div id="recall-feed"></div>
</div>

<!-- legend -->
<div class="hud" id="hud-legend">
  <div class="legend-item"><div class="legend-dot" style="background:#cba6f7"></div><span class="legend-label">wisdom</span></div>
  <div class="legend-item"><div class="legend-dot" style="background:#89b4fa"></div><span class="legend-label">belief</span></div>
  <div class="legend-item"><div class="legend-dot" style="background:#a6e3a1"></div><span class="legend-label">habit</span></div>
  <div class="legend-item"><div class="legend-dot" style="background:#f9e2af"></div><span class="legend-label">episode</span></div>
  <div class="legend-item"><div class="legend-dot" style="background:#fab387"></div><span class="legend-label">milestone</span></div>
  <div class="legend-item"><div class="legend-dot" style="background:#f38ba8"></div><span class="legend-label">correction</span></div>
  <div class="legend-item"><div class="legend-dot" style="background:#94e2d5"></div><span class="legend-label">preference</span></div>
  <div class="legend-item"><div class="legend-dot" style="background:#89dceb"></div><span class="legend-label">dream</span></div>
</div>

<script>
// ── Constants ────────────────────────────────────────────────────────────────
const KIND_COLOR = {
  wisdom:     '#cba6f7',
  belief:     '#89b4fa',
  habit:      '#a6e3a1',
  episode:    '#f9e2af',
  milestone:  '#fab387',
  correction: '#f38ba8',
  preference: '#94e2d5',
  dream:      '#89dceb',
  fact:       '#74c7ec',
  unknown:    '#6e6e8e',
  symbol:     '#2a2a3e',
};
const DIM_COLOR = '#1a1a2a';

const serverUrl = `${location.protocol}//${location.hostname}:8765`;

// ── State ─────────────────────────────────────────────────────────────────────
let graphData = { nodes: [], links: [] };
let totalMemories = 0;
let searchQuery = '';
let searchMatches = new Set();

// recallGlow: nodeId → expiry timestamp
const recallGlow = new Map();
let glowTimer = null;

// Subgraph highlight: selected node + its direct neighbors
let selectedNodeId = null;
const neighborSet = new Set(); // ids of neighbors of selected node

let graph = null;
const nodeColorFn = node => {
  const nid = String(node.id);
  // Recalled: lerp towards white then fade back to kind color
  const expiry = recallGlow.get(nid);
  if (expiry) {
    const ratio = Math.max(0, (expiry - Date.now()) / 3200);
    return lerpColor(KIND_COLOR[node.kind] || DIM_COLOR, '#ffffff', ratio * 0.85);
  }
  // Search dim
  if (searchQuery && !searchMatches.has(nid)) return DIM_COLOR;
  // Subgraph: dim nodes not in neighborhood
  if (selectedNodeId) {
    if (nid === selectedNodeId) return KIND_COLOR[node.kind] || DIM_COLOR;
    if (neighborSet.has(nid)) return lerpColor(KIND_COLOR[node.kind] || DIM_COLOR, '#ffffff', 0.3);
    return DIM_COLOR;
  }
  return KIND_COLOR[node.kind] || DIM_COLOR;
};
const nodeValFn = node => {
  const nid = String(node.id);
  const base = 1 + (node.strength || 0.3) * 6;
  const expiry = recallGlow.get(nid);
  if (expiry) {
    const ratio = Math.max(0, (expiry - Date.now()) / 3200);
    return base * (1 + ratio * 4);
  }
  // Selected node: bigger
  if (selectedNodeId && nid === selectedNodeId) return base * 2;
  return base;
};
const linkColorFn = link => {
  if (!selectedNodeId) return 'rgba(89,179,250,0.1)';
  const src = String(typeof link.source === 'object' ? link.source.id : link.source);
  const tgt = String(typeof link.target === 'object' ? link.target.id : link.target);
  if (src === selectedNodeId || tgt === selectedNodeId) return 'rgba(203,166,247,0.7)';
  return 'rgba(89,179,250,0.04)';
};
const linkWidthFn = link => {
  if (!selectedNodeId) return Math.max(0.2, (link.weight || 0.3));
  const src = String(typeof link.source === 'object' ? link.source.id : link.source);
  const tgt = String(typeof link.target === 'object' ? link.target.id : link.target);
  if (src === selectedNodeId || tgt === selectedNodeId) return 2;
  return 0.2;
};

// ── Color utility ─────────────────────────────────────────────────────────────
function hexToRgb(hex) {
  const h = parseInt(hex.slice(1), 16);
  return [(h >> 16) & 0xff, (h >> 8) & 0xff, h & 0xff];
}
function lerpColor(a, b, t) {
  const [ar,ag,ab] = hexToRgb(a);
  const [br,bg,bb] = hexToRgb(b);
  const r = Math.round(ar + (br-ar)*t);
  const g = Math.round(ag + (bg-ag)*t);
  const bv = Math.round(ab + (bb-ab)*t);
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${bv.toString(16).padStart(2,'0')}`;
}

// ── Graph init ─────────────────────────────────────────────────────────────────
function initGraph() {
  graph = ForceGraph3D()(document.getElementById('graph-container'))
    .backgroundColor('#070710')
    .showNavInfo(false)
    .nodeLabel(node => {
      const color = KIND_COLOR[node.kind] || '#888';
      return `<div style="background:rgba(7,7,20,0.95);border:1px solid ${color}40;border-radius:5px;padding:7px 11px;font-family:monospace;font-size:11px;color:#cdd6f4;max-width:280px;line-height:1.5">
        <div style="color:${color};font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">${node.kind}</div>
        ${node.label}
      </div>`;
    })
    .nodeColor(nodeColorFn)
    .nodeVal(nodeValFn)
    .nodeOpacity(0.92)
    .linkColor(linkColorFn)
    .linkWidth(linkWidthFn)
    .linkOpacity(0.35)
    .onNodeClick(node => { selectNode(node); showInspector(node); })
    .onBackgroundClick(() => {
      if (selectedNodeId) {
        selectedNodeId = null;
        neighborSet.clear();
        graph.nodeColor(nodeColorFn).nodeVal(nodeValFn)
             .linkColor(linkColorFn).linkWidth(linkWidthFn);
      }
      if (document.getElementById('hud-inspector').classList.contains('visible')) {
        closeInspector();
      }
    });

  // Warm-up physics with faster simulation
  graph.d3Force('charge').strength(-80);
}

// ── Glow animation ────────────────────────────────────────────────────────────
function triggerGlowUpdate() {
  if (glowTimer) return;
  glowTimer = setInterval(() => {
    const now = Date.now();
    let anyAlive = false;
    for (const [id, expiry] of recallGlow) {
      if (expiry < now) { recallGlow.delete(id); }
      else anyAlive = true;
    }
    // Re-assign functions to trigger 3d-force-graph re-render
    graph.nodeColor(nodeColorFn).nodeVal(nodeValFn)
         .linkColor(linkColorFn).linkWidth(linkWidthFn);
    if (!anyAlive) {
      clearInterval(glowTimer);
      glowTimer = null;
    }
  }, 80);
}

// ── Load graph data ───────────────────────────────────────────────────────────
async function loadGraph() {
  const url = `${serverUrl}/graph?limit=500&kinds=wisdom,belief,habit,episode,milestone,correction,preference,dream,fact,unknown`;
  try {
    const r = await fetch(url);
    const d = await r.json();
    graphData.nodes = d.nodes || [];
    graphData.links = (d.edges || []).map(e => ({
      source: e.source,
      target: e.target,
      weight: e.weight || 0.3,
    }));
    graph.graphData(graphData);
    updateMemoryCount();
  } catch(e) {
    console.error('[chitta] graph load failed', e);
  }
}

function updateMemoryCount() {
  const shown = graphData.nodes.length;
  const total = totalMemories || shown;
  document.getElementById('memory-count').textContent =
    `${shown.toLocaleString()} shown · ${total.toLocaleString()} total`;
}

// ── Subgraph selection ────────────────────────────────────────────────────────
function selectNode(node) {
  const nid = String(node.id);
  if (selectedNodeId === nid) {
    // Deselect on second click
    selectedNodeId = null;
    neighborSet.clear();
  } else {
    selectedNodeId = nid;
    neighborSet.clear();
    // Build neighbor set from current links
    for (const link of graphData.links) {
      const src = String(typeof link.source === 'object' ? link.source.id : link.source);
      const tgt = String(typeof link.target === 'object' ? link.target.id : link.target);
      if (src === nid) neighborSet.add(tgt);
      if (tgt === nid) neighborSet.add(src);
    }
  }
  graph.nodeColor(nodeColorFn).nodeVal(nodeValFn)
       .linkColor(linkColorFn).linkWidth(linkWidthFn);
}

// ── Inspector ─────────────────────────────────────────────────────────────────
let selectedNode = null;
async function showInspector(node) {
  selectedNode = node;
  const insp = document.getElementById('hud-inspector');
  insp.classList.add('visible');
  document.getElementById('hud-instances').style.display = 'none';

  const color = KIND_COLOR[node.kind] || '#888';
  const badge = document.getElementById('insp-kind-badge');
  badge.textContent = node.kind || 'unknown';
  badge.style.color = color;
  badge.style.borderColor = color + '40';
  badge.style.background = color + '18';

  document.getElementById('insp-content').textContent = node.label;
  const ts = node.ts_ms && node.ts_ms > 0
    ? new Date(node.ts_ms).toLocaleString()
    : '—';
  document.getElementById('insp-meta').innerHTML =
    `id: ${node.id} · str: ${(node.strength||0).toFixed(3)}` +
    (node.realm ? ` · realm: ${node.realm}` : '') +
    `<br>${ts}`;

  document.getElementById('insp-assocs').innerHTML =
    '<span style="color:var(--dim)">loading…</span>';
  try {
    const r = await fetch(`${serverUrl}/memory/${node.id}`);
    const d = await r.json();
    const assocs = d.associations || [];
    if (assocs.length > 0) {
      document.getElementById('insp-assocs').innerHTML = assocs.slice(0, 12).map(a =>
        `<div class="assoc-item" onclick="focusNode('${a.id}')">
          <span class="assoc-rel">${a.kind || ''} · ${(a.score||0).toFixed(3)}</span>
          ${a.preview || a.label || a.id}
        </div>`
      ).join('');
    } else {
      document.getElementById('insp-assocs').innerHTML =
        '<span style="color:var(--dim)">no associations found</span>';
    }
  } catch(e) {
    document.getElementById('insp-assocs').innerHTML =
      '<span style="color:var(--red)">fetch failed</span>';
  }
}

function closeInspector() {
  document.getElementById('hud-inspector').classList.remove('visible');
  document.getElementById('hud-instances').style.display = 'block';
  selectedNode = null;
  selectedNodeId = null;
  neighborSet.clear();
  graph.nodeColor(nodeColorFn).nodeVal(nodeValFn)
       .linkColor(linkColorFn).linkWidth(linkWidthFn);
}

function focusNode(nodeId) {
  const node = graphData.nodes.find(n => String(n.id) === String(nodeId));
  if (!node) return;
  // Fly camera to node
  const dist = 80;
  const distRatio = 1 + dist / Math.hypot(node.x||0, node.y||0, node.z||0);
  graph.cameraPosition(
    { x: (node.x||0) * distRatio, y: (node.y||0) * distRatio, z: (node.z||0) * distRatio },
    { x: node.x||0, y: node.y||0, z: node.z||0 },
    800
  );
  showInspector(node);
}

// ── Search ────────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.toLowerCase().trim();
  searchMatches.clear();
  if (searchQuery) {
    graphData.nodes.forEach(n => {
      if ((n.label||'').toLowerCase().includes(searchQuery)) {
        searchMatches.add(String(n.id));
      }
    });
    document.getElementById('search-count').textContent = `${searchMatches.size} hits`;
  } else {
    document.getElementById('search-count').textContent = '';
  }
  graph.nodeColor(nodeColorFn).linkColor(linkColorFn);
});

// ── Stats panel ───────────────────────────────────────────────────────────────
function updateStats(s) {
  const total = s.memories ?? s.total ?? 0;
  if (total) totalMemories = total;
  document.getElementById('s-total').textContent = total.toLocaleString();
  document.getElementById('s-symbols').textContent = (s.symbols ?? 0).toLocaleString();
  const trips = s.stats?.total_triplets ?? s.triplets ?? 0;
  document.getElementById('s-triplets').textContent = trips.toLocaleString();
  updateMemoryCount();

  const kinds = s.stats?.count_by_kind || {};
  if (Object.keys(kinds).length > 0) {
    const maxCount = Math.max(...Object.values(kinds));
    const bar = document.getElementById('kind-bar');
    bar.innerHTML = Object.entries(kinds)
      .filter(([k]) => k !== 'symbol')
      .sort(([,a],[,b]) => b - a)
      .map(([k, n]) => {
        const color = KIND_COLOR[k] || '#6e6e8e';
        const pct = Math.round((n / maxCount) * 100);
        return `<div class="kind-row" onclick="filterByKind('${k}')">
          <span class="kind-dot" style="background:${color}"></span>
          <span class="kind-name">${k}</span>
          <span class="kind-count">${n.toLocaleString()}</span>
        </div>
        <div class="kind-bar-fill" style="background:${color};width:${pct}%"></div>`;
      }).join('');
  }
}

function filterByKind(kind) {
  // Toggle kind filter in search
  if (searchQuery === `kind:${kind}`) {
    document.getElementById('search').value = '';
    document.getElementById('search').dispatchEvent(new Event('input'));
  } else {
    // Highlight nodes of this kind
    searchQuery = '';
    searchMatches.clear();
    graphData.nodes.forEach(n => {
      if (n.kind === kind) searchMatches.add(String(n.id));
    });
    // Use searchQuery trick: set a special query that won't match text but use searchMatches
    searchQuery = '\x00kind\x00'; // sentinel value that won't match text
    document.getElementById('search-count').textContent = `${searchMatches.size} ${kind}`;
    graph.nodeColor(nodeColorFn).linkColor(linkColorFn);
  }
}

// ── Instances ─────────────────────────────────────────────────────────────────
function updateInstances(data) {
  const list = document.getElementById('instances-list');
  const insts = data.instances || [];
  if (!insts.length) {
    list.innerHTML = '<span style="color:var(--dim)">none active</span>';
    return;
  }
  list.innerHTML = insts.map(i => {
    const secs = i.age_secs || 0;
    const age = secs < 60 ? `${secs}s`
               : secs < 3600 ? `${Math.floor(secs/60)}m`
               : `${Math.floor(secs/3600)}h`;
    return `<div class="inst-item">
      <span class="inst-dot ${i.status==='active'?'active':''}" style="background:${i.color}"></span>
      <span class="inst-project" title="${i.id}">${i.project}</span>
      <span class="inst-age">${age}</span>
    </div>`;
  }).join('');
}

// ── Recall events ─────────────────────────────────────────────────────────────
function handleRecall(data) {
  const ids = data.ids || data.memory_ids || [];
  if (!ids.length) return;

  const expiry = Date.now() + 3500;
  ids.forEach(id => recallGlow.set(String(id), expiry));
  triggerGlowUpdate();

  // Feed
  const feed = document.getElementById('recall-feed');
  const item = document.createElement('div');
  item.className = 'recall-item';
  const t = new Date(data.ts_ms || Date.now()).toLocaleTimeString();
  item.innerHTML = `
    <span class="recall-count">${ids.length} mem</span>
    <span style="color:var(--dim)">·</span>
    <span style="color:var(--dim)">${data.passes||1} pass</span>
    <span class="recall-time">${t}</span>`;
  feed.prepend(item);
  while (feed.children.length > 8) feed.removeChild(feed.lastChild);
}

// ── SSE connection ────────────────────────────────────────────────────────────
function connectSSE() {
  const dot = document.getElementById('connection-dot');
  const lbl = document.getElementById('conn-label');

  const es = new EventSource(`${serverUrl}/events`);
  es.onopen = () => {
    dot.className = 'ok';
    lbl.textContent = 'live';
  };
  es.onerror = () => {
    dot.className = '';
    lbl.textContent = 'reconnecting…';
    setTimeout(connectSSE, 5000);
    es.close();
  };
  es.addEventListener('stats',     e => updateStats(JSON.parse(e.data)));
  es.addEventListener('instances', e => updateInstances(JSON.parse(e.data)));
  es.addEventListener('recall',    e => handleRecall(JSON.parse(e.data)));
}

// ── Boot ────────────────────────────────────────────────────────────────────
initGraph();
loadGraph();
connectSSE();

// Initial data fetch
fetch(`${serverUrl}/instances`).then(r=>r.json()).then(updateInstances).catch(()=>{});
fetch(`${serverUrl}/health`).then(r=>r.json()).then(d => {
  // Pre-populate total so memory-count shows right away
  if (d.memories) {
    totalMemories = d.memories;
    updateMemoryCount();
  }
}).catch(()=>{});
</script>
