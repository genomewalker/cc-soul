line-length = 100

# PYTHON FLOOR IS 3.9 — do not raise this without checking the note below.
#
# This tree has two interpreters, and the lower one wins for lint purposes:
#
#   3.12  chitta-mcp/server.py and what it imports. Launched only through the
#         conda `bioinfo` env — both systemd units run ~/.local/bin/chitta-mcp,
#         whose shebang is that interpreter, and run-codex-mcp.sh uses
#         `conda run -n bioinfo`. It also needs the `mcp` SDK, itself 3.10+.
#         This is the floor chitta-mcp/pyproject.toml states (>=3.10).
#
#   3.9   everything else. Hook scripts and the standalone chitta-mcp modules
#         run under `#!/usr/bin/env python3`, which on the deployment hosts
#         resolves to PyPy 3.9 (/usr/bin/python3 is older still, 3.6).
#
# target-version = "py39" keeps ruff from ever introducing syntax the hook
# interpreter cannot run: it disables B905 (`zip(strict=)`) outright and only
# applies the PEP 604 union rewrites (UP007/UP045) to files that carry
# `from __future__ import annotations`, which makes those annotations strings
# rather than runtime expressions. Every module in scope imports cleanly on
# both interpreters; the lint-python CI job asserts that on 3.9.
target-version = "py39"

exclude = [
    # Generated by chitta-mcp/sync_tools.py from the daemon's tools/list.
    "chitta-mcp/tools_static.py",
    # Third-party sources vendored verbatim.
    "benchmarks/editing/vendor",
    # Benchmark fixture repos: deliberately incomplete stubs (unused imports are
    # hints, bodies are `raise NotImplementedError`) that the agent under test
    # fills in. Linting or autofixing them changes what the benchmark measures.
    "benchmarks/smriti/tasks",
]

[lint]
# BLE001 makes a blanket `except Exception` a lint error rather than a code
# review habit: the handful of places that genuinely need one carry an explicit
# `# noqa: BLE001` plus a comment saying why swallowing is correct there.
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
# `ruff format` owns line layout and already wraps to line-length above. Every
# line it cannot wrap is a single long string literal — SQL, a terminal report
# format string, a test fixture sentence — where splitting hurts grep-ability
# and catches no defects. Linting layout on top of a formatter just fights it.
ignore = ["E501"]

[lint.per-file-ignores]
# Hook and CLI entrypoints prepend their own directory to sys.path before
# importing sibling modules, so module-level imports cannot all come first.
"chitta-mcp/session_registry.py" = ["E402"]
"chitta-mcp/resume_selector.py" = ["E402"]
"chitta-mcp/outcome_ledger.py" = ["E402"]
"hooks/stop-transcript-snapshot.py" = ["E402"]
